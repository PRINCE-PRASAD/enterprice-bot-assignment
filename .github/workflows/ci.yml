name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chart-and-image:
    name: Lint chart, build image, Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz" -o /tmp/helm.tgz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Lint chart
        run: |
          helm lint chart
          helm template demo chart >/dev/null

      - name: Build image
        run: docker build --tag "demo-service:${{ github.sha }}" service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-service:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
